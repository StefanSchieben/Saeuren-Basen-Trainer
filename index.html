<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemie-Trainer – IGS Gerhard Ertl</title>
<style>
:root{--igs-blau:#003c69;--igs-orange:#ff6600;--igs-gelb:#ff9900;--weiss:#fff;--grau-50:#f7f7f7;--grau-200:#eee;--grau-300:#d6d6d6;--grau-600:#666;--font-sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--grau-200);color:#000;font-size:16px;line-height:24px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top{background:var(--weiss);border-bottom:1px solid var(--grau-300)}
.top .wrap{display:flex;align-items:center;gap:15px;padding-top:10px;padding-bottom:10px}
.top img{height:48px;width:auto;display:block}
.top span{border-left:1px solid var(--grau-300);padding-left:15px;font-weight:700;font-size:18px;color:var(--igs-blau)}
.hero{position:relative;overflow:hidden;background:var(--igs-blau);color:var(--weiss);padding:48px 24px;margin:24px 0}
.hero h1{margin:0 0 8px;font-size:36px;line-height:44px;position:relative}
.hero p{margin:0;max-width:520px;position:relative}
.hero svg{position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:240px;height:240px}
@media (max-width:640px){.hero{padding:24px 24px 130px}.hero h1{font-size:28px;line-height:36px}.hero svg{top:auto;bottom:-70px;transform:none;width:200px;height:200px}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;padding-bottom:48px}
a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--weiss);border-top:4px solid var(--igs-orange);padding:24px}
a.card:hover{background:var(--grau-50)}
a.card:focus-visible{outline:3px solid var(--igs-blau);outline-offset:2px}
.num{width:36px;height:36px;display:grid;place-items:center;background:var(--igs-blau);color:var(--weiss);font-weight:700;font-size:18px}
b{font-size:20px;line-height:28px;color:var(--igs-blau)}
.d{color:var(--grau-600);flex:1}
.more{color:var(--igs-blau);font-weight:700}
</style>
</head>
