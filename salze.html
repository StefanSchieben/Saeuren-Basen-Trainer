<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salze & Neutralisation – IGS Gerhard Ertl</title>
<style>
/* Design System „IGS Gerhard Ertl“ */
:root{
  --igs-blau:#003c69; --igs-orange:#ff6600; --igs-gelb:#ff9900;
  --weiss:#ffffff; --grau-50:#f7f7f7; --grau-100:#f5f5f5; --grau-200:#eeeeee; --grau-300:#d6d6d6;
  --grau-500:#999999; --grau-600:#666666; --text-dunkel:#463939; --schwarz:#000000;
  --font-sans:Arial, Helvetica, sans-serif;
  --space-1:8px; --space-2:15px; --space-3:24px; --space-4:48px;
  --radius-none:0; --radius-md:6px; --radius-full:9999px;
  /* Rollen in der App */
  --bg:var(--grau-200); --ink:var(--schwarz); --muted:var(--grau-600); --line:var(--grau-300);
  --acid:var(--igs-orange); --base:var(--igs-blau); --salt:var(--igs-gelb);
  --accent:var(--igs-blau); --accent-soft:#e5ecf1;
  /* Rückmeldefarben (funktional, nicht Teil des Schul-Designs) */
  --ok:#1b7f45; --ok-soft:#e5f4ea; --bad:#c62f2f; --bad-soft:#fbeaea; --warn:#8a5a00; --warn-soft:#fff3df;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:24px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
sub,sup{font-size:.7em;line-height:0}
.f{font-family:"Cambria Math",Cambria,Georgia,"Times New Roman",serif;font-size:1.08em;white-space:nowrap}
:focus-visible{outline:3px solid var(--igs-blau);outline-offset:2px}

/* Kopfbereich */
.top{background:var(--weiss);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap;padding-top:10px;padding-bottom:0}
.brand{display:flex;align-items:center;gap:var(--space-2);background:none;border:0;padding:0 0 10px;text-align:left}
.brand img{height:48px;width:auto;display:block}
.apptitle{border-left:1px solid var(--line);padding-left:var(--space-2)}
.apptitle b{display:block;font-size:18px;line-height:22px;color:var(--igs-blau)}
.apptitle small{display:block;color:var(--muted);font-size:13px;line-height:18px}
.tabs{display:flex;gap:var(--space-3);align-self:flex-end}
.tabs button{border:0;border-top:2px solid transparent;background:none;padding:var(--space-2) 0;font-weight:700;font-size:18px;line-height:24px;letter-spacing:.54px;text-transform:uppercase;color:var(--igs-blau)}
.tabs button.on{border-top-color:var(--igs-orange)}
.tabs button:hover{border-top-color:var(--grau-300)}
.tabs button.on:hover{border-top-color:var(--igs-orange)}
@media (max-width:560px){
  .brand img{height:38px}
  .apptitle b{font-size:16px}
  .tabs{gap:var(--space-2)}
  .tabs button{font-size:15px;padding:10px 0}
}

main{padding-top:var(--space-3);padding-bottom:var(--space-4)}
h1{font-size:32px;line-height:40px;margin:0 0 var(--space-1);color:var(--igs-blau)}
h2{font-size:24px;line-height:32px;color:var(--igs-blau)}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:20px}
.center{text-align:center;margin-top:var(--space-3)}

/* Buttons */
.btn{border:2px solid var(--igs-blau);background:var(--weiss);color:var(--igs-blau);padding:10px var(--space-3);border-radius:var(--radius-md);font-weight:700}
.btn:hover{background:var(--grau-100)}
.btn.primary{background:var(--igs-blau);color:var(--weiss)}
.btn.primary:hover{background:#00528f;border-color:#00528f}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{text-decoration:underline}
.btn:disabled{opacity:.5;cursor:default}

/* Startseite */
.hero{position:relative;background:var(--igs-blau);color:var(--weiss);padding:var(--space-4) var(--space-3);margin-bottom:var(--space-3);overflow:hidden}
.hero h1{color:var(--weiss);font-size:36px;line-height:44px;max-width:520px;position:relative}
.hero p{max-width:520px;margin:var(--space-1) 0 0;position:relative}
.hero .kicker{font-size:14px;font-weight:700;letter-spacing:.54px;text-transform:uppercase;margin:0 0 var(--space-1);color:var(--weiss)}
.hero .atom{position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:260px;height:260px}
@media (max-width:640px){.hero{padding:var(--space-3) var(--space-3) 150px}.hero h1{font-size:28px;line-height:36px}.hero .atom{top:auto;bottom:-70px;right:-30px;transform:none;width:220px;height:220px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-3)}
.tile{display:flex;flex-direction:column;gap:var(--space-1);text-align:left;background:var(--weiss);border:0;border-top:4px solid var(--igs-orange);padding:var(--space-3)}
.tile:hover{background:var(--grau-50)}
.tile .num{width:36px;height:36px;display:grid;place-items:center;background:var(--igs-blau);color:var(--weiss);font-weight:700;font-size:18px}
.tile b{font-size:20px;line-height:28px;color:var(--igs-blau)}
.tile span.d{color:var(--muted);font-size:15px;line-height:22px;flex:1}
.tile .more{color:var(--igs-blau);font-weight:700}
.best{margin-top:var(--space-3);padding:var(--space-2) var(--space-3);background:var(--weiss);border-left:4px solid var(--ok);color:var(--ok);font-weight:700}

/* Lernen */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-2)}
.seg{display:flex;background:var(--weiss);border:1px solid var(--line);border-radius:var(--radius-md);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:4px;font-size:14px;font-weight:700;color:var(--igs-blau)}
.seg button.on{background:var(--igs-blau);color:var(--weiss)}
.info{background:var(--weiss);border-left:4px solid var(--igs-orange);padding:var(--space-2) var(--space-3);margin:var(--space-2) 0}
.info h3{margin:0 0 var(--space-1);font-size:20px;line-height:28px;color:var(--igs-blau)}
.info p{margin:0 0 6px}
.tips{margin:6px 0 0;padding-left:20px}
.tips li{margin:3px 0}
.grp{display:flex;align-items:center;gap:10px;margin:var(--space-4) 0 var(--space-2)}
.grp::before{content:"";width:14px;height:14px;background:var(--igs-orange)}
.info .big{font-size:20px;line-height:28px;font-weight:700;margin:4px 0 8px;color:var(--igs-blau)}

/* Salz-Baukasten */
.kit{background:var(--weiss);padding:var(--space-3);border-top:4px solid var(--igs-blau)}
.kit .lbl{font-size:14px;margin:2px 0 8px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-2)}
.pick{border:2px solid var(--line);background:var(--weiss);border-radius:var(--radius-md);padding:6px 12px;font-size:14px;font-weight:700;color:var(--igs-blau)}
.pick:hover{border-color:var(--igs-blau)}
.pick.acid.on{border-color:var(--igs-orange);background:#fff0e6;color:var(--schwarz)}
.pick.base.on,.pick.pr.on{border-color:var(--igs-blau);background:var(--igs-blau);color:var(--weiss)}
.steps{border-top:1px solid var(--grau-200);margin-top:4px;padding-top:var(--space-2)}
.steps ol{margin:0;padding-left:22px}
.steps li{margin:7px 0}
.steps .res{margin-top:var(--space-2);background:var(--grau-100);border-left:4px solid var(--igs-gelb);padding:var(--space-2)}
.steps .res .nm{font-size:20px;line-height:28px;font-weight:700;color:var(--igs-blau)}
.fact{margin-top:var(--space-1);font-size:14px;line-height:20px;color:var(--text-dunkel)}

/* Übersicht */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:var(--space-2)}
.card{background:var(--weiss);border-top:4px solid var(--acid)}
.card header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px var(--space-2);background:var(--grau-100)}
.card .nm{font-weight:700;color:var(--igs-blau)}
.card .fm{font-size:18px}
.st{width:100%;border-collapse:collapse;font-size:15px}
.st td{padding:7px 12px;border-top:1px solid var(--grau-200);vertical-align:middle}
.st td.bs{color:var(--igs-blau);font-size:13px;font-weight:700;white-space:nowrap;width:1%}
.st td.sf{white-space:nowrap;width:110px}
@media (max-width:560px){
  .st tr{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:2px;padding:7px 12px;border-top:1px solid var(--grau-200)}
  .st td{border:0;padding:0}
  .st td.bs{grid-column:1/-1;width:auto}
  .st td.sf{width:auto}
  .st td:last-child{overflow-wrap:anywhere}
}
.cov:not(.rev){color:transparent!important;background:repeating-linear-gradient(135deg,var(--grau-200) 0 6px,var(--grau-100) 6px 12px);cursor:pointer;user-select:none}
.cov:not(.rev) *{color:transparent!important}

/* Üben / Test */
.panel{background:var(--weiss);padding:var(--space-3)}
.lbl{font-weight:700;margin:4px 0 8px;color:var(--igs-blau)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--space-3)}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:var(--radius-md);padding:8px 14px;cursor:pointer;background:var(--weiss)}
.chip:has(input:checked){border-color:var(--igs-blau);background:var(--accent-soft)}
.chip input{accent-color:var(--igs-blau);margin:0}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--igs-blau)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--weiss);padding:5px 12px;font-size:14px;font-weight:700;color:var(--igs-blau)}
.stat.ok{color:var(--ok)} .stat.bad{color:var(--bad)} .stat.stk{color:var(--warn)}
.bar{height:8px;background:var(--weiss);overflow:hidden;margin-bottom:var(--space-2)}
.bar i{display:block;height:100%;background:var(--igs-orange);transition:width .3s}

.qcard{background:var(--weiss);padding:var(--space-3)}
.qtag{display:inline-block;font-size:12px;line-height:16px;font-weight:700;text-transform:uppercase;letter-spacing:.54px;padding:4px 10px;margin-bottom:var(--space-1);background:var(--grau-100);color:var(--igs-blau);border-left:4px solid var(--grau-500)}
.qtag.t-salt{border-left-color:var(--salt)}
.qtag.t-eq{border-left-color:var(--igs-blau)}
.qtag.t-mix{border-left-color:var(--grau-600)}
.prompt{font-size:20px;line-height:30px;margin:0 0 var(--space-2);font-weight:700;color:var(--schwarz)}
.prompt .f{font-size:1.15em}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--weiss);border-radius:var(--radius-md);padding:12px 14px;font-size:17px;min-height:54px}
.opt:hover:not(:disabled){border-color:var(--igs-blau);background:var(--grau-50)}
.opt .k{flex:none;width:24px;height:24px;background:var(--igs-blau);color:var(--weiss);font-size:12px;font-weight:700;display:grid;place-items:center}
.opt .on{color:var(--muted);font-size:14px;margin-left:4px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad)}

.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;font-size:22px;padding:10px 14px;border:2px solid var(--line);border-radius:var(--radius-md);outline:none;background:var(--weiss);color:var(--schwarz);font-family:var(--font-sans)}
.inrow input.formula{font-family:"Cambria Math",Cambria,Georgia,"Times New Roman",serif}
.inrow input:focus{border-color:var(--igs-blau)}
.inrow input.right{border-color:var(--ok);background:var(--ok-soft)}
.inrow input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.kbd{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kbd button{min-width:44px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--grau-100);font-weight:700;font-size:16px;color:var(--igs-blau)}
.kbd button:hover{background:var(--grau-200)}
.kbd .sep{width:8px}
.hint{font-size:13px;line-height:19px;color:var(--muted);margin:8px 0 0}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{border:2px solid var(--line);background:var(--weiss);border-radius:var(--radius-md);padding:10px 12px;min-height:50px;font-size:16px;text-align:left}
.mitem:hover:not(:disabled){border-color:var(--igs-blau)}
.mitem.sel{border-color:var(--igs-blau);background:var(--accent-soft)}
.mitem.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mitem.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.fb{margin-top:var(--space-2);padding:12px var(--space-2);font-size:15px;line-height:22px;border-left:4px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.part{background:var(--warn-soft);border-color:var(--igs-gelb)}
.fb b.t{display:block;font-size:16px;margin-bottom:3px}
.fb .ex{color:var(--text-dunkel);margin-top:4px}
.qnav{display:flex;justify-content:flex-end;margin-top:var(--space-2);gap:8px}

/* Ergebnis */
.result{text-align:center;padding:var(--space-3)}
.ring{width:150px;height:150px;border-radius:var(--radius-full);margin:6px auto 14px;display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:var(--radius-full);background:var(--weiss);display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--igs-blau)}
.sync{display:inline-block;margin-top:8px;font-size:14px;padding:6px 12px}
.sync.on{background:var(--ok-soft);color:var(--ok);font-weight:700}
.sync.off{background:var(--grau-100);color:var(--muted)}
.review{text-align:left;margin-top:var(--space-3)}
.review li{margin:8px 0}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:var(--space-3)}
footer{color:var(--muted);font-size:13px;line-height:19px;text-align:center;padding:0 16px 30px}

/* Reaktionsgleichungen */
.eq{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 7px;font-size:20px}
.eq .co{font-weight:700;margin-right:1px;color:var(--igs-blau)}
.eq .arrow{font-size:1.1em;margin:0 3px}
.eq .blank{display:inline-grid;place-items:center;min-width:64px;height:34px;border:2px dashed var(--grau-500);color:var(--muted);font-weight:700}
.eqbox{background:var(--grau-100);padding:var(--space-2);margin-bottom:12px;overflow-x:auto}
.prompt .eq{font-size:20px}
.opt .eq{font-size:17px}
.opts.wide{grid-template-columns:1fr}
.fb .eq{font-size:16px}
input.coef{width:2.2em;height:38px;font-size:20px;text-align:center;border:2px solid var(--grau-500);border-radius:var(--radius-md);background:var(--weiss);color:var(--schwarz);outline:none;padding:0;font-family:var(--font-sans)}
input.coef:focus{border-color:var(--igs-blau)}
input.coef.right{border-color:var(--ok);background:var(--ok-soft)}
input.coef.wrong{border-color:var(--bad);background:var(--bad-soft)}
</style>
</head>

  "NH4Cl":"Salmiak", "NaHCO3":"Natron – im Backpulver", "Na2CO3":"Soda", "K2CO3":"Pottasche – Backtriebmittel für Lebkuchen",
  "CaCO3":"Kalk, Kreide und Marmor", "Ca(HCO3)2":"gelöst im Leitungswasser – verursacht die Wasserhärte",
  "NH4HCO3":"Hirschhornsalz – Backtriebmittel", "KNO3":"Kalisalpeter – Dünger", "NaNO3":"Natronsalpeter (Chilesalpeter) – Dünger",
  "NH4NO3":"Stickstoffdünger", "(NH4)2SO4":"Stickstoffdünger", "CaSO4":"Gips ist wasserhaltiges Calciumsulfat",
  "Ca3(PO4)2":"Calciumphosphate sind Hauptbestandteil von Knochen und Zähnen", "CH3COONa":"in Taschenwärmern (Wärmekissen)",
  "NaCN":"sehr giftig", "KCN":"Zyankali – sehr giftig"
};

/* ============ Hilfsfunktionen ============ */
const $ = s => document.querySelector(s);
const app = $("#app");
const rand = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const gcd = (x,y) => y ? gcd(y, x%y) : x;
const NUMW = ["", "ein", "zwei", "drei"];
const protons = n => NUMW[n] + " Proton" + (n>1?"en":"") + " (H<sup>+</sup>)";
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function fHTML(body, q){
  let s = body.replace(/(\d+)/g, "<sub>$1</sub>");
  if(q){ const n = Math.abs(q); s += "<sup>" + (n>1?n:"") + (q<0?"−":"+") + "</sup>"; }
  return '<span class="f">' + s + "</span>";
}
const poly = f => (f.match(/[A-Z]/g)||[]).length>1 || /\d/.test(f);
const part = (f,n) => n>1 ? (poly(f) ? `(${f})${n}` : `${f}${n}`) : f;

const SUB = "₀₁₂₃₄₅₆₇₈₉", SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
function flat(s){
  let o = "";
  for(const c of s){
    let i = SUB.indexOf(c); if(i>=0){o+=i;continue;}
    i = SUP.indexOf(c); if(i>=0){o+=i;continue;}
    if("⁻−–—".includes(c)){o+="-";continue;}
    if(c==="⁺"){o+="+";continue;}
    o += c;
  }
  return o;
}
function prettyInput(s){
  const f = flat(s); let o = "";
  for(let i=0;i<f.length;i++){
    const c = f[i], prev = f[i-1]||"";
    if(/\d/.test(c) && /[A-Za-z)\d]/.test(prev)) o += SUB[c];
    else o += c;
  }
  return o;
}
const normF = s => flat(s).replace(/[\s^·]/g,"");
function normN(s){
  return s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[\s\-–]/g,"");
}
function lev(a,b){
  const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n];
}

/* ============ Salze berechnen ============ */
function makeSalt(acid, res, base){
  const k = res.step, m = base.cat.m, g = gcd(k,m), a = k/g, b = m/g;
  const anFirst = res.f==="CH3COO";
  const build = (aa,bb,cf=base.cat.f,af=res.f) => { const c=part(cf,aa), n=part(af,bb); return anFirst ? n+c : c+n; };
  const f = build(a,b);
  const catS = part(base.cat.f,a), anS = part(res.f,b);
  const forms = [f, catS+anS];
  if(anFirst){ const alt = part("C2H3O2",b); forms.push(anS+catS, catS+alt, alt+catS); if(b===1) forms.push(catS+"("+res.f+")"); }
  const pre = a===2 ? "di" : a===3 ? "tri" : "";
  const names = [];
  [base.cat.name, ...base.cat.alt].forEach(cn => [res.name, ...res.alt].forEach(rn => {
    names.push(cn + rn.toLowerCase()); if(pre) names.push(pre + cn + rn.toLowerCase());
  }));
  const water = base.nh3 ? 0 : a*m;
  return {acid, res, base, k, m, a, b, f, forms:[...new Set(forms)], rev: anFirst ? null : anS+catS,
    name: base.cat.name + res.name.toLowerCase(), alts:names, coef:[b, a, 1, water],
    full: k===acid.res.length, fact: FACTS[f], build};
}
const SALTS_FULL = [], SALTS_PART = [];
ACIDS.forEach(ac => BASES.forEach(bs => {
  ac.res.forEach(r => (r.step===ac.res.length ? SALTS_FULL : SALTS_PART).push(makeSalt(ac, r, bs)));
}));
const ALL_SALTS = [...SALTS_FULL, ...SALTS_PART];
const SX = s => fHTML(s.f, 0);

/* Reaktionsgleichung als HTML */
function eqHTML(s, o={}){
  const c = o.coef || s.coef;
  const co = i => o.inputs ? `<input class="coef" data-i="${i}" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Koeffizient">`
                           : (c[i]>1 ? `<span class="co">${c[i]}</span>` : "");
  const sp = (html, blank) => blank ? '<span class="blank">?</span>' : html;
  const water = o.water!==undefined ? o.water : !s.base.nh3;
  let h = `<span>${co(0)}${sp(fHTML(s.acid.body,0), o.blank==="acid")}</span><span>+</span>`
        + `<span>${co(1)}${sp(fHTML(s.base.f,0), o.blank==="base")}</span><span class="arrow">→</span>`
        + `<span>${co(2)}${sp(o.saltF ? fHTML(o.saltF,0) : SX(s), o.blank==="salt")}</span>`;
  if(water) h += `<span>+</span><span>${co(3)}${fHTML("H2O",0)}</span>`;
  return `<span class="eq">${h}</span>`;
}

/* ============ Prüfen von Eingaben ============ */
function checkSaltFormula(input, s){
  const u = normF(input);
  if(!u) return {ok:false, hint:"Du hast nichts eingegeben."};
  if(s.forms.includes(u)) return {ok:true};
  if(s.forms.some(x => x.toLowerCase()===u.toLowerCase())) return {ok:false, hint:"Fast! Achte auf Groß- und Kleinschreibung (z. B. Cl, Na, Ca, CO ≠ Co)."};
  if(/[+-]/.test(u)) return {ok:false, hint:"In der Formel eines Salzes schreibt man keine Ladungen – die Ladungen gleichen sich aus."};
  if(s.base.nh3 && s.forms.some(x => x.replace(/NH4/g,"NH3")===u)) return {ok:false, hint:"Ammoniak (NH₃) nimmt ein Proton auf – im Salz steht das Ammonium-Ion NH₄⁺."};
  if(s.rev && u===s.rev) return {ok:false, hint:"Zuerst kommt das Metall- bzw. Ammonium-Ion, dann der Säurerest."};
  const np = x => x.replace(/[()]/g,"");
  if(/\(/.test(s.f) && s.forms.some(x => np(x)===np(u))) return {ok:false, hint:"Mehratomige Ionen müssen in Klammern stehen, wenn sie mehrfach vorkommen."};
  const letters = x => x.replace(/[\d()]/g,"");
  if(s.forms.some(x => letters(x)===letters(u))) return {ok:false, hint:"Die Ionen stimmen, aber das Verhältnis nicht. Gleiche die Ladungen aus!"};
  return {ok:false};
}
const ALL_NAMES = ALL_SALTS.flatMap(s => s.alts.map(n => ({n:normN(n), s})));
function checkSaltName(input, s){
  const u = normN(input);
  if(!u) return {ok:false, hint:"Du hast nichts eingegeben."};
  const targets = s.alts.map(normN);
  if(targets.includes(u)) return {ok:true};
  const other = ALL_NAMES.filter(x => x.s.f!==s.f);
  if(other.some(x => x.n===u)) return {ok:false};
  const close = targets.some(t => lev(u,t)<=1), closeOther = other.some(x => lev(u,x.n)<=1);
  if(close && !closeOther) return {ok:true, note:`Kleiner Tippfehler – richtig geschrieben: <b>${s.name}</b>`};
  if(/säure|saeure|lauge/.test(u)) return {ok:false, hint:"Gesucht ist der Name des Salzes: Metall- bzw. Ammonium-Ion + Säurerest."};
  return {ok:false};
}

/* ============ Ablenker ============ */
function fakeFormulas(s){
  const out = new Set();
  [[s.b,s.a],[1,1],[1,2],[2,1],[1,3],[3,1],[2,3],[3,2]].forEach(([x,y]) => {
    if(x===s.a && y===s.b) return;
    if(x>1 && y>1 && gcd(x,y)>1) return;
    out.add(s.build(x,y));
  });
  if(s.f.includes("(")) out.add(s.f.replace(/[()]/g,""));
  if(s.base.nh3) out.add(s.f.replace(/NH4/g,"NH3"));
  s.forms.forEach(x => out.delete(x));
  return [...out];
}
function neighbors(s, pool){
  return pool.filter(x => x!==s).map(x => ({x, sc:(x.base===s.base?1:0)+(x.acid===s.acid?1.2:0)+(x.res.f.replace(/\d/g,"")===s.res.f.replace(/\d/g,"")?.8:0)+Math.random()*1.3}))
    .sort((p,q)=>q.sc-p.sc).map(o=>o.x);
}
function formulaOptions(s, pool){
  const fakes = shuffle(fakeFormulas(s));
  const real = neighbors(s, pool).filter(x => !fakes.includes(x.f)).slice(0,1).map(x => x.f);
  const opts = [...fakes.slice(0, 3-real.length), ...real];
  return shuffle([s.f, ...opts]).map(f => ({html:fHTML(f,0), correct:f===s.f}));
}
function nameOptions(s, pool, render){
  const nb = neighbors(s, pool).filter((x,i,arr) => arr.findIndex(y=>y.name===x.name)===i).slice(0,3);
  return shuffle([s, ...nb]).map(x => ({html:render(x), correct:x===s}));
}
function eqOptions(s){
  const c = s.coef, saltErr = [], coefErr = [];
  if(!s.base.nh3) coefErr.push({water:false});
  else coefErr.push({water:true, coef:[c[0],c[1],1,c[1]]});
  if(!s.base.nh3) coefErr.push({coef:[c[0],c[1],1, c[3]===1 ? 2 : (c[3]===2 ? 1 : c[3]-1)]});
  coefErr.push({coef:[c[0], c[1]===1?2:1, 1, c[3]]});
  coefErr.push({coef:[c[0]===1?2:1, c[1], 1, c[3]]});
  if(c.some((x,i)=>i!==2 && x>1 && (i<3||!s.base.nh3))) coefErr.push({coef:[1,1,1,1]});
  fakeFormulas(s).forEach(ff => saltErr.push({saltF:ff}));
  const correct = eqHTML(s), seen = new Set([correct]), picks = [];
  const add = o => { const h = eqHTML(s,o); if(!seen.has(h)){ seen.add(h); picks.push(h); } };
  shuffle(saltErr).slice(0,1).forEach(add);
  shuffle(coefErr).forEach(o => { if(picks.length<3) add(o); });
  shuffle(saltErr).forEach(o => { if(picks.length<3) add(o); });
  return shuffle([correct, ...picks.slice(0,3)]).map(h => ({html:h, correct:h===correct}));
}

/* ============ Erklärungen ============ */
function reaction(s){
  return s.full ? `<b>${s.acid.name}</b> wird mit <b>${s.base.name}</b> neutralisiert.`
                : `<b>${s.acid.name}</b> gibt nur ${protons(s.k)} ab und reagiert mit <b>${s.base.name}</b>.`;
}
function explain(s){
  return `<div>${eqHTML(s)}</div><div>${s.name}: ${s.a>1?s.a+" ":""}${fHTML(s.base.cat.f,s.m)} und ${s.b>1?s.b+" ":""}${fHTML(s.res.f,-s.k)}${s.base.nh3 ? " – bei Ammoniak entsteht kein Wasser." : ""}</div>`
    + (s.fact ? `<div class="fact">💡 ${s.fact}</div>` : "");
}
function stepsHTML(s){
  const cat = fHTML(s.base.cat.f, s.m), an = fHTML(s.res.f, -s.k);
  const baseLine = s.base.nh3
    ? `Ammoniak ${fHTML("NH3",0)} nimmt ein Proton (H<sup>+</sup>) auf und wird zum Ammonium-Ion ${cat}.`
    : `${s.base.name} ${fHTML(s.base.f,0)} liefert ${cat} und ${s.m>1?s.m+" ":""}${fHTML("OH",-1)}.`;
  const acidLine = `${s.acid.name} ${fHTML(s.acid.body,0)} gibt ${protons(s.k)} ab. Säurerest: ${s.res.name} ${an}.`;
  const charge = `Ladungen ausgleichen: ${s.a} × (+${s.m}) + ${s.b} × (−${s.k}) = 0 → ${s.a} ${cat} und ${s.b} ${an}.`;
  const water = s.base.nh3
    ? "Es entsteht kein Wasser – das Proton steckt jetzt im Ammonium-Ion."
    : `${s.coef[3]} H<sup>+</sup> + ${s.coef[3]} OH<sup>−</sup> → ${s.coef[3]} ${fHTML("H2O",0)} (Neutralisation).`;
  return `<ol><li>${acidLine}</li><li>${baseLine}</li><li>${charge}</li><li>${water}</li></ol>
    <div class="res"><div class="nm">${s.name} ${SX(s)}</div>
    <div style="margin-top:8px">${eqHTML(s)}</div>${s.fact ? `<div class="fact">💡 ${s.fact}</div>` : ""}</div>`;
}

/* ============ Aufgabentypen ============ */
const T_SALT = ["Salz","t-salt"], T_EQ = ["Reaktionsgleichung","t-eq"];
function poolFor(s, prof){ return prof || !s.full ? ALL_SALTS : SALTS_FULL; }
const G = {
  sMcName: (s,P) => ({kind:"mc", item:s, tag:T_SALT, prompt:`Wie heißt das Salz ${SX(s)}?`,
    options:nameOptions(s, P, x => x.name), solution:s.name}),
  sMcFormula: (s,P) => ({kind:"mc", item:s, tag:T_SALT, prompt:`Welche Formel hat <b>${s.name}</b>?`,
    options:formulaOptions(s, P), solution:SX(s)}),
  sInName: s => ({kind:"input", mode:"name", item:s, tag:T_SALT, prompt:`Wie heißt das Salz ${SX(s)}? Schreibe den Namen.`, solution:s.name}),
  sInFormula: s => ({kind:"input", mode:"formula", item:s, tag:T_SALT, prompt:`Schreibe die Formel von <b>${s.name}</b>.`, solution:SX(s)}),
  sProduct: (s,P) => ({kind:"mc", item:s, tag:T_SALT, prompt:`${reaction(s)} Welches Salz entsteht?`,
    options:nameOptions(s, P, x => `${SX(x)} <span class="on">${x.name}</span>`), solution:`${SX(s)} ${s.name}`}),
  sProductIn: s => ({kind:"input", mode:"name", item:s, tag:T_SALT, prompt:`${reaction(s)} Wie heißt das Salz, das entsteht?`, solution:s.name}),
  sReactants: s => {
    const nb = neighbors(s, SALTS_FULL).filter((x,i,arr)=>arr.findIndex(y=>y.acid===x.acid&&y.base===x.base)===i).slice(0,3);
    return {kind:"mc", item:s, tag:T_SALT, prompt:`Aus welcher Säure und welcher Base entsteht <b>${s.name}</b> ${SX(s)}?`,
      options:shuffle([s,...nb]).map(x => ({html:`${x.acid.name} + ${x.base.name}`, correct:x===s})), solution:`${s.acid.name} + ${s.base.name}`};
  },
  eqMC: s => ({kind:"mc", wide:true, item:s, tag:T_EQ, prompt:`${reaction(s)} Welche Reaktionsgleichung ist richtig?`,
    options:eqOptions(s), solution:eqHTML(s)}),
  eqCoef: s => ({kind:"coef", item:s, tag:T_EQ, prompt:`Gleiche die Reaktionsgleichung aus. Bildung von <b>${s.name}</b>:`, solution:eqHTML(s)}),
  eqProduct: (s,P) => ({kind:"mc", item:s, tag:T_EQ, prompt:`Welches Salz fehlt?<div style="margin-top:10px">${eqHTML(s,{blank:"salt"})}</div>`,
    options:formulaOptions(s, P), solution:SX(s)}),
  eqProductIn: s => ({kind:"input", mode:"formula", item:s, tag:T_EQ, prompt:`Ergänze die Formel des Salzes:<div style="margin-top:10px">${eqHTML(s,{blank:"salt"})}</div>`, solution:SX(s)}),
  eqReactant: s => {
    const isAcid = Math.random()<.6;
    const correct = isAcid ? s.acid.body : s.base.f;
    const others = shuffle((isAcid ? ACIDS.map(a=>a.body) : BASES.map(b=>b.f)).filter(x=>x!==correct)).slice(0,3);
    return {kind:"mc", item:s, tag:T_EQ, prompt:`Welche ${isAcid?"Säure":"Base"} fehlt?<div style="margin-top:10px">${eqHTML(s,{blank:isAcid?"acid":"base"})}</div>`,
      options:shuffle([correct,...others]).map(f => ({html:fHTML(f,0), correct:f===correct})), solution:fHTML(correct,0)};
  },
  match: list => ({kind:"match", item:null, items:list, tag:["Zuordnen","t-mix"], prompt:"Ordne den Salzformeln die richtigen Namen zu.",
    pairs:list.map(s => ({l:SX(s), r:s.name})), solution:list.map(s => `${SX(s)} ${s.name}`).join(" · ")})
};
const MC_TYPES = {names:["sMcName","sMcFormula","sProduct","sReactants"], eq:["eqMC","eqProduct","eqReactant"]};
const IN_TYPES = {names:["sInName","sInFormula","sProductIn"], eq:["eqCoef","eqProductIn"]};
function typesFor(s, cats, fmt){
  let t = [];
  ["names","eq"].forEach(c => { if(!cats.includes(c)) return;
    if(fmt!=="in") t.push(...MC_TYPES[c]);
    if(fmt!=="mc") t.push(...IN_TYPES[c]);
  });
  if(!s.full) t = t.filter(x => x!=="sReactants");
  if(s.coef.every(x=>x===1) || (s.base.nh3 && s.coef.slice(0,3).every(x=>x===1))) t = t.filter(x => x!=="eqCoef" || Math.random()<.3);
  return t;
}
function makeQ(type, s, prof){ const P = poolFor(s, prof); return G[type](s, P); }

/* ============ SCORM 1.2 ============ */
const SCORM = {
  api:null, done:false,
  find(w){ let n=0; while(w && n<12){ try{ if(w.API) return w.API; }catch(e){ return null; } if(w.parent===w) break; w=w.parent; n++; } return null; },
  init(){
    this.api = this.find(window);
    if(!this.api && window.opener) this.api = this.find(window.opener);
    if(!this.api) return;
    try{
      this.api.LMSInitialize("");
      const st = this.get("cmi.core.lesson_status");
      if(!st || st==="not attempted") this.set("cmi.core.lesson_status","incomplete");
      this.api.LMSCommit("");
    }catch(e){ this.api = null; }
  },
  get(k){ try{ return this.api ? String(this.api.LMSGetValue(k)) : ""; }catch(e){ return ""; } },
  set(k,v){ try{ this.api && this.api.LMSSetValue(k, String(v)); }catch(e){} },
  best(){ const v = parseFloat(this.get("cmi.core.score.raw")); return isNaN(v) ? null : v; },
  report(pct){
    if(!this.api) return false;
    const prev = this.best(), best = prev===null ? pct : Math.max(prev, pct);
    this.set("cmi.core.score.min",0); this.set("cmi.core.score.max",100); this.set("cmi.core.score.raw",best);
    this.set("cmi.core.lesson_status", best>=CONFIG.PASS_PERCENT ? "passed" : "failed");
    try{ this.api.LMSCommit(""); }catch(e){}
    return true;
  },
  finish(){ if(this.api && !this.done){ this.done = true; try{ this.api.LMSCommit(""); this.api.LMSFinish(""); }catch(e){} } }
};
SCORM.init();
window.addEventListener("pagehide", () => SCORM.finish());
window.addEventListener("beforeunload", () => SCORM.finish());

const KIT = {acid:1, base:0, step:2};
function viewLearn(){

  <h1>Lernen</h1>
  <div class="info">
    <h3>Neutralisation</h3>
    <p class="big">Säure + Base → Salz + Wasser</p>
    <p>Die H<sup>+</sup>-Ionen der Säure und die OH<sup>−</sup>-Ionen der Base reagieren zu Wasser: H<sup>+</sup> + OH<sup>−</sup> → H<sub>2</sub>O. Übrig bleiben das Metall-Ion der Base und der Säurerest – sie bilden zusammen das <b>Salz</b>.</p>
    <ul class="tips">
      <li><b>Name des Salzes</b> = Metall-Ion + Säurerest, z. B. Natrium + Sulfat → Natriumsulfat</li>
      <li><b>Formel</b>: Die Ladungen müssen sich ausgleichen. Ca<sup>2+</sup> und Cl<sup>−</sup> → CaCl<sub>2</sub></li>
      <li><b>Klammern</b> setzt man um mehratomige Ionen, wenn sie mehrfach vorkommen: Ca<sub>3</sub>(PO<sub>4</sub>)<sub>2</sub>, (NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub></li>
      <li><b>Sonderfall Ammoniak</b>: NH<sub>3</sub> nimmt das H<sup>+</sup> auf und wird zum Ammonium-Ion NH<sub>4</sub><sup>+</sup>. Dabei entsteht <b>kein Wasser</b>: NH<sub>3</sub> + HCl → NH<sub>4</sub>Cl</li>
      <li><b>Hydrogensalze</b> entstehen, wenn eine Säure nicht alle Protonen abgibt: NaOH + H<sub>2</sub>SO<sub>4</sub> → NaHSO<sub>4</sub> + H<sub>2</sub>O</li>
    </ul>
  </div>

  <h2 class="grp">Salz-Baukasten</h2>
  <div class="kit" id="kit"></div>

  <div class="sec-head" style="margin-top:30px"><h2 class="grp" style="margin:0">Alle Salze im Überblick</h2>
    <div class="seg" id="seg">
      <button data-cover="none" class="on">Alles zeigen</button>
      <button data-cover="f">Formeln abdecken</button>
      <button data-cover="n">Namen abdecken</button>
    </div>
  </div>
  <p class="muted small">Vollständige Neutralisation – die Säure gibt alle Protonen ab.<span id="covhint" hidden> Tippe auf ein abgedecktes Feld, um es aufzudecken.</span></p>
  <div class="cards">${ACIDS.map(card).join("")}</div>
  <div class="center"><button class="btn primary" data-go="train">Jetzt üben →</button></div>`;

  renderKit();
  $("#seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x===b));
    const m = b.dataset.cover;
    document.querySelectorAll("[data-c]").forEach(el => { el.classList.toggle("cov", el.dataset.c===m); el.classList.remove("rev"); });
    $("#covhint").hidden = m==="none";
  });
  app.querySelectorAll("[data-c]").forEach(el => el.addEventListener("click", () => { if(el.classList.contains("cov")) el.classList.toggle("rev"); }));
}
function renderKit(){
  const acid = ACIDS[KIT.acid], base = BASES[KIT.base];
  if(KIT.step>acid.res.length) KIT.step = acid.res.length;
  const s = ALL_SALTS.find(x => x.acid===acid && x.base===base && x.res.step===KIT.step);
  $("#kit").innerHTML = `
    <div class="lbl">Säure</div>
    <div class="picks">${ACIDS.map((a,i)=>`<button class="pick acid ${i===KIT.acid?"on":""}" data-a="${i}">${a.name}</button>`).join("")}</div>
    <div class="lbl">Base</div>
    <div class="picks">${BASES.map((b,i)=>`<button class="pick base ${i===KIT.base?"on":""}" data-b="${i}">${b.name}</button>`).join("")}</div>
    ${acid.res.length>1 ? `<div class="lbl">Wie viele Protonen gibt die Säure ab?</div>
    <div class="picks">${acid.res.map(r=>`<button class="pick pr ${r.step===KIT.step?"on":""}" data-s="${r.step}">${r.step} H<sup>+</sup>${r.step===acid.res.length?" (vollständig)":""}</button>`).join("")}</div>` : ""}
    <div class="steps">${stepsHTML(s)}</div>`;
  $("#kit").querySelectorAll(".pick").forEach(b => b.onclick = () => {
    if(b.dataset.a!==undefined){ KIT.acid = +b.dataset.a; KIT.step = ACIDS[KIT.acid].res.length; }
    if(b.dataset.b!==undefined) KIT.base = +b.dataset.b;
    if(b.dataset.s!==undefined) KIT.step = +b.dataset.s;
    renderKit();
  });
}

/* ============ Aufgabe anzeigen ============ */
let nextHandler = null;
document.addEventListener("keydown", e => {
  if(e.key==="Enter" && nextHandler && !e.target.closest("input")){ e.preventDefault(); nextHandler(); return; }
  if(/^[1-4]$/.test(e.key) && !e.target.closest("input")){
    const o = document.querySelectorAll(".opt:not(:disabled)")[+e.key-1]; if(o) o.click();
  }
});
function renderQuestion(q, header, onAnswered, onNext){
  nextHandler = null;
  app.innerHTML = `${header}
  <div class="qcard">
    <span class="qtag ${q.tag[1]}">${q.tag[0]}</span>
    <h2 class="prompt">${q.prompt}</h2>
    <div id="qbody"></div>
    <div id="fb" class="fb" hidden></div>
    <div class="qnav"><button class="btn primary" id="next" hidden>Weiter →</button></div>
  </div>`;
  const body = $("#qbody");
  const coarse = matchMedia("(pointer:coarse)").matches;
  let answered = false;
  const finish = (score, title, extra) => {
    if(answered) return; answered = true;
    const fb = $("#fb");
    fb.className = "fb " + (score>=.999 ? "ok" : score>0 ? "part" : "bad");
    fb.innerHTML = `<b class="t">${title}</b>${extra||""}${q.item ? `<div class="ex">${explain(q.item)}</div>` : ""}`;
    fb.hidden = false;
    const nb = $("#next"); nb.hidden = false;
    nextHandler = () => { nextHandler = null; onNext(); };
    nb.onclick = nextHandler;
    onAnswered(score);
    setTimeout(() => { nb.focus({preventScroll:true}); fb.scrollIntoView({block:"nearest", behavior:"smooth"}); }, 30);
  };

  if(q.kind==="mc"){
    body.innerHTML = `<div class="opts ${q.wide?"wide":""}">${q.options.map((o,i) =>
      `<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${o.html}</span></button>`).join("")}</div>`;
    body.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const o = q.options[+b.dataset.i];
      body.querySelectorAll(".opt").forEach((x,i) => { x.disabled = true; if(q.options[i].correct) x.classList.add("right"); });
      if(o.correct) finish(1, "Richtig! 🎉");
      else { b.classList.add("wrong"); finish(0, "Leider falsch.", q.wide ? "" : `Richtig ist: ${q.solution}`); }
    }));
  }

  if(q.kind==="input"){
    const isF = q.mode==="formula";
    body.innerHTML = `
      <div class="inrow">
        <input id="ans" class="${isF?"formula":""}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          placeholder="${isF ? "Formel eingeben" : "Name eingeben"}" aria-label="Antwort">
        <button class="btn primary" id="chk">Prüfen</button>
      </div>
      ${isF ? `<div class="kbd" id="kbd">
        ${["H","C","N","O","S","P","Cl","Na","K","Ca"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}
        <span class="sep"></span>
        ${["2","3","4","(",")"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}
        <button data-k="BS" title="Löschen">⌫</button>
      </div>
      <p class="hint">Zahlen werden automatisch tiefgestellt. Salzformeln schreibt man ohne Ladungen.</p>` : ""}`;
    const inp = $("#ans");
    if(!coarse) inp.focus();
    if(isF){
      inp.addEventListener("input", () => { const p = inp.selectionStart; inp.value = prettyInput(inp.value); try{ inp.setSelectionRange(p,p); }catch(e){} });
      $("#kbd").addEventListener("click", e => {
        const b = e.target.closest("button"); if(!b || answered) return;
        const k = b.dataset.k, v = inp.value;
        let s = inp.selectionStart ?? v.length, en = inp.selectionEnd ?? v.length;
        if(k==="BS"){ if(s===en && s>0) s--; inp.value = v.slice(0,s) + v.slice(en); }
        else { inp.value = v.slice(0,s) + k + v.slice(en); s = s + k.length; }
        inp.value = prettyInput(inp.value);
        if(!coarse) inp.focus();
        try{ inp.setSelectionRange(s,s); }catch(e){}
      });
    }
    const submit = () => {
      if(answered) return;
      const r = isF ? checkSaltFormula(inp.value, q.item) : checkSaltName(inp.value, q.item);
      inp.readOnly = true; $("#chk").disabled = true;
      inp.classList.add(r.ok ? "right" : "wrong");
      if(r.ok) finish(1, "Richtig! 🎉", r.note ? `<div>${r.note}</div>` : "");
      else finish(0, "Leider falsch.", `${r.hint ? `<div>${r.hint}</div>` : ""}<div>Richtig ist: ${q.solution}</div>`);
    };
    $("#chk").onclick = submit;
    inp.addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); if(answered && nextHandler) nextHandler(); else submit(); } });
  }

  if(q.kind==="coef"){
    const s = q.item;
    body.innerHTML = `<div class="eqbox">${eqHTML(s,{inputs:true})}</div>
      <div class="inrow" style="justify-content:space-between;align-items:center">
        <p class="hint" style="margin:0">Trage die Koeffizienten ein. Leere Felder zählen als 1.</p>
        <button class="btn primary" id="chk">Prüfen</button>
      </div>`;
    const ins = [...body.querySelectorAll("input.coef")];
    if(!coarse) ins[0].focus();
    const submit = () => {
      if(answered) return;
      const vals = ins.map(i => i.value.trim()==="" ? 1 : parseInt(i.value,10));
      const target = s.coef.slice(0, ins.length);
      ins.forEach((i,n) => { i.readOnly = true; i.classList.add(vals[n]===target[n] ? "right" : "wrong"); });
      $("#chk").disabled = true;
      if(vals.every((v,n) => v===target[n])) return finish(1, "Richtig ausgeglichen! 🎉");
      const t = vals[0]/target[0];
      if(Number.isInteger(t) && t>1 && vals.every((v,n) => v===t*target[n]))
        return finish(.5, "Fast!", "<div>Die Gleichung ist ausgeglichen, aber nicht mit den kleinstmöglichen Zahlen. Kürze die Koeffizienten.</div>");
      finish(0, "Leider falsch.", `<div>Richtig ist: ${q.solution}</div>`);
    };
    ins.forEach((i,n) => {
      i.addEventListener("input", () => { i.value = i.value.replace(/\D/g,"").slice(0,2); });
      i.addEventListener("keydown", e => {
        if(e.key==="Enter"){ e.preventDefault(); if(answered && nextHandler) nextHandler(); else submit(); }
      });
    });
    $("#chk").onclick = submit;
  }

  if(q.kind==="match"){
    const L = shuffle(q.pairs.map((p,i)=>({i, html:p.l})));
    const R = shuffle(q.pairs.map((p,i)=>({i, html:p.r})));
    body.innerHTML = `
      <div class="match">
        <div class="mcol">${L.map(x=>`<button class="mitem" data-s="L" data-i="${x.i}">${x.html}</button>`).join("")}</div>
        <div class="mcol">${R.map(x=>`<button class="mitem" data-s="R" data-i="${x.i}">${x.html}</button>`).join("")}</div>
      </div>
      <p class="hint">Tippe links eine Formel an und dann rechts den passenden Namen.</p>`;
    let sel = null, mistakes = 0, left = q.pairs.length;
    body.querySelectorAll(".mitem").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(!sel || sel.dataset.s===b.dataset.s){
        if(sel) sel.classList.remove("sel");
        sel = (sel===b) ? null : b; if(sel) sel.classList.add("sel"); return;
      }
      const a = sel; sel = null; a.classList.remove("sel");
      if(a.dataset.i===b.dataset.i){
        [a,b].forEach(x => { x.classList.add("done"); x.disabled = true; });
        if(--left===0){
          const n = q.pairs.length, sc = Math.max(0, (n-mistakes)/n);
          if(mistakes===0) finish(1, "Alles richtig zugeordnet! 🎉");
          else finish(sc, `Geschafft – mit ${mistakes} Fehlversuch${mistakes>1?"en":""}.`, `<div>Richtig: ${q.solution}</div>`);
        }
      } else {
        mistakes++;
        [a,b].forEach(x => { x.classList.remove("wrong"); void x.offsetWidth; x.classList.add("wrong"); setTimeout(()=>x.classList.remove("wrong"), 600); });
      }
    }));
  }
}

/* ============ Üben ============ */
let T = null;
function viewTrainSetup(){
  setTab("train");
  app.innerHTML = `
  <h1>Üben</h1>
  <p class="muted">Wähle aus, was du üben möchtest. Falsch beantwortete Salze kommen nach kurzer Zeit wieder.</p>
  <div class="panel">
    <p class="lbl">Was möchtest du üben?</p>
    <div class="chips">
      <label class="chip"><input type="checkbox" name="cat" value="names" checked> Salznamen &amp; Formeln</label>
      <label class="chip"><input type="checkbox" name="cat" value="eq" checked> Reaktionsgleichungen</label>
      <label class="chip"><input type="checkbox" name="cat" value="prof"> Hydrogensalze (Profi)</label>
    </div>
    <p class="lbl">Wie möchtest du antworten?</p>
    <div class="chips">
      <label class="chip"><input type="radio" name="fmt" value="mc"> Nur Auswahl (leichter)</label>
      <label class="chip"><input type="radio" name="fmt" value="mix" checked> Auswahl + Eintippen</label>
      <label class="chip"><input type="radio" name="fmt" value="in"> Nur Eintippen (schwer)</label>
    </div>
    <button class="btn primary" id="go">Los geht's →</button>
    <p class="hint" id="err" hidden style="color:var(--bad)">Bitte wähle „Salznamen &amp; Formeln“ oder „Reaktionsgleichungen“.</p>
  </div>`;
  $("#go").onclick = () => {
    const sel = [...document.querySelectorAll("input[name=cat]:checked")].map(x=>x.value);
    const cats = sel.filter(c => c!=="prof");
    if(!cats.length){ $("#err").hidden = false; return; }
    startTrain(cats, sel.includes("prof"), document.querySelector("input[name=fmt]:checked").value, []);
  };
}
function startTrain(cats, prof, fmt, preload){
  T = {cats, prof, fmt, ok:0, bad:0, streak:0, best:0, n:0, last:null, repeat:preload.map((s,i)=>({item:s, due:i+1}))};
  nextTrain();
}
function trainHeader(){
  return `<div class="qhead"><div class="stats" id="stats">${trainStats()}</div><button class="btn ghost" data-go="train">Beenden</button></div>`;
}
function trainStats(){
  return `<span class="stat ok">✔ ${T.ok}</span><span class="stat bad">✘ ${T.bad}</span>
    <span class="stat stk">🔥 Serie ${T.streak}${T.best>1 ? ` (Rekord ${T.best})` : ""}</span>
    ${T.repeat.length ? `<span class="stat">↻ ${T.repeat.length} zum Wiederholen</span>` : ""}`;
}
function nextTrain(){
  T.n++;
  const pool = T.prof ? (Math.random()<.4 ? SALTS_PART : SALTS_FULL) : SALTS_FULL;
  let q;
  const d = T.repeat.findIndex(r => r.due<=T.n);
  if(d<0 && T.cats.includes("names") && T.fmt!=="in" && Math.random()<.08){
    q = G.match(shuffle(SALTS_FULL).slice(0,4));
  } else {
    let s = d>=0 ? T.repeat.splice(d,1)[0].item : null;
    if(!s){ do { s = rand(pool); } while(s===T.last); }
    let types = typesFor(s, T.cats, T.fmt);
    if(!types.length) types = typesFor(s, T.cats, "mix");
    q = makeQ(rand(types), s, T.prof);
  }
  T.last = q.item;
  renderQuestion(q, trainHeader(), score => {
    if(score>=.999){ T.ok++; T.streak++; T.best = Math.max(T.best, T.streak); }
    else {
      T.bad++; T.streak = 0;
      (q.item ? [q.item] : q.items).forEach((s,i) => T.repeat.push({item:s, due:T.n+3+i*2}));
    }
    $("#stats").innerHTML = trainStats();
  }, nextTrain);
}

/* ============ Test ============ */
const TEST_PLAN = ["eqCoef","eqCoef","eqCoef","eqMC","eqMC","eqMC","eqProduct","eqProductIn","eqReactant",
  "sProduct","sProduct","sProductIn","sReactants","sMcName","sMcFormula","sInName","sInName","sInFormula","sInFormula","match"];
let TS = null;
function viewTestIntro(){
  setTab("test");
  const best = SCORM.best();
  app.innerHTML = `
  <h1>Test</h1>
  <div class="panel">
    <p>Der Test hat <b>${TEST_PLAN.length} Aufgaben</b> zur vollständigen Neutralisation: Reaktionsgleichungen ausgleichen und ergänzen, Salze benennen und ihre Formeln aufschreiben.</p>
    <p>Nach jeder Aufgabe siehst du, ob du richtig lagst. Ab <b>${CONFIG.PASS_PERCENT} %</b> hast du bestanden.</p>
    ${SCORM.api ? `<p class="muted small">Dein Ergebnis wird in Moodle gespeichert. Du kannst den Test beliebig oft wiederholen – es zählt dein bestes Ergebnis.${best!==null ? ` Bisher bestes Ergebnis: <b>${best} %</b>.` : ""}</p>` : ""}
    <button class="btn primary" id="go">Test starten →</button>
  </div>`;
  $("#go").onclick = startTest;
}
function buildTest(){
  const hard = shuffle(SALTS_FULL.filter(s => s.coef.some((x,i)=>x>1)));
  const easy = shuffle(SALTS_FULL);
  const used = new Set();
  const take = list => { const s = list.find(x => !used.has(x)) || rand(list); used.add(s); return s; };
  return shuffle(TEST_PLAN.map(t => {
    if(t==="match"){ const l = shuffle(SALTS_FULL.filter(x=>!used.has(x))).slice(0,4); return G.match(l); }
    const s = take(["eqCoef","eqMC"].includes(t) ? hard : easy);
    return makeQ(t, s, false);
  }));
}
function startTest(){ TS = {qs:buildTest(), i:0, score:0, log:[]}; testRunning = true; showTestQ(); }
const fmtPts = x => (Math.round(x*100)/100).toString().replace(".",",");
function showTestQ(){
  const q = TS.qs[TS.i], n = TS.qs.length;
  const header = `<div class="qhead"><b>Aufgabe ${TS.i+1} von ${n}</b><span class="stat">Punkte: <span id="pts">${fmtPts(TS.score)}</span></span></div>
    <div class="bar"><i style="width:${TS.i/n*100}%"></i></div>`;
  renderQuestion(q, header, score => { TS.score += score; TS.log.push({q, score}); $("#pts").textContent = fmtPts(TS.score); },
    () => { TS.i++; if(TS.i<TS.qs.length) showTestQ(); else showResult(); });
}
function showResult(){
  testRunning = false;
  setTab("test");
  const n = TS.qs.length, pct = Math.round(TS.score/n*100);
  const sent = SCORM.report(pct), passed = pct>=CONFIG.PASS_PERCENT;
  const col = passed ? "var(--igs-blau)" : "var(--igs-orange)";
  const msg = pct===100 ? "Perfekt! Du beherrschst alles. 🏆" : pct>=85 ? "Sehr gut gemacht! 💪" : passed ? "Bestanden – gute Arbeit!" : "Noch nicht bestanden. Übe die markierten Aufgaben und versuche es noch einmal!";
  const wrong = TS.log.filter(l => l.score<.999);
  const wrongItems = [...new Set(wrong.flatMap(l => l.q.item ? [l.q.item] : l.q.items))];
  app.innerHTML = `
  <div class="panel result">
    <h1>Dein Ergebnis</h1>
    <div class="ring" style="background:conic-gradient(${col} ${pct*3.6}deg,var(--grau-200) 0)"><div>${pct} %</div></div>
    <p><b>${fmtPts(TS.score)} von ${n} Punkten</b></p>
    <p>${msg}</p>
    <span class="sync ${sent?"on":"off"}">${sent ? "✓ Ergebnis in Moodle gespeichert" : "Ohne Moodle-Verbindung – das Ergebnis wird nicht gespeichert."}</span>
    ${wrong.length ? `<div class="review"><h2>Das solltest du noch üben</h2><ul>${wrong.map(l =>
      `<li>${l.q.prompt}<br><span class="muted small">Richtig: ${l.q.solution}</span></li>`).join("")}</ul></div>` : ""}
    <div class="actions">
      ${wrongItems.length ? `<button class="btn primary" id="practice">Fehler gezielt üben</button>` : ""}
      <button class="btn" id="again">Neuer Test</button>
      <button class="btn ghost" data-go="home">Zur Startseite</button>
    </div>
  </div>`;
  $("#again").onclick = startTest;
  const p = $("#practice");
  if(p) p.onclick = () => { setTab("train"); startTrain(["names","eq"], false, "mix", shuffle(wrongItems)); };
}

viewHome();
</script>
